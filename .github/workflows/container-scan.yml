name: "Container Image Security Scan"

on:
  push:
    branches: ["main", "release/**"]
  pull_request:
    paths:
      - "backend/Dockerfile"
      - "frontend/Dockerfile"
      - "docker-compose.yml"
      - ".github/workflows/container-scan.yml"

permissions:
  contents: read
  security-events: write

jobs:
  build-and-scan:
    name: "Build Images & Scan for CVEs"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4

      - name: "Set up Docker Buildx"
        uses: docker/setup-buildx-action@v3

      - name: "Build Backend API Docker Image"
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          load: true
          tags: nexus-api:scan-target
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: "Scan Backend API Container with Trivy"
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "nexus-api:scan-target"
          format: "sarif"
          output: "trivy-backend.sarif"
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true

      - name: "Build Frontend Docker Image"
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          load: true
          tags: nexus-frontend:scan-target
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: "Scan Frontend Container with Trivy"
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "nexus-frontend:scan-target"
          format: "sarif"
          output: "trivy-frontend.sarif"
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true

      - name: "Upload SARIF reports to GitHub Security"
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: "trivy-backend.sarif"
          category: "nexus-backend-image"
