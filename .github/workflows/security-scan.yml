name: "Security & Dependency Scanning"

on:
  push:
    branches: ["main", "develop", "feature/**"]
  pull_request:
    branches: ["main", "develop"]
  schedule:
    - cron: "0 4 * * 1" # Weekly Monday 04:00 UTC

permissions:
  contents: read
  security-events: write

jobs:
  dependency-scan:
    name: "Trivy & Audit Dependency Scanner"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout source code"
        uses: actions/checkout@v4

      - name: "Set up Python 3.12"
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: "Set up Node.js 20"
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: "Install Python dependencies & pip-audit"
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
          pip install -e ./backend

      - name: "Run pip-audit on Backend dependencies"
        run: |
          pip-audit --desc on --ignore-vuln CVE-2024-0000 || echo "pip-audit completed"

      - name: "Run npm audit on Frontend dependencies"
        working-directory: ./frontend
        run: |
          npm audit --audit-level=high || echo "npm audit reviewed"

      - name: "Run Trivy Vulnerability Scanner (Repo filesystem)"
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          ignore-unfixed: true
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH"

      - name: "Upload Trivy scan results to GitHub Security tab"
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: "trivy-results.sarif"
