[project]
name = "nexus-backend"
version = "0.1.0"
description = "NEXUS — Agentic Workflow Intelligence Platform (Backend)"
requires-python = ">=3.12"
license = { text = "Proprietary" }

dependencies = [
    "fastapi==0.115.12",
    "uvicorn[standard]==0.34.2",
    "pydantic==2.11.3",
    "pydantic-settings==2.9.1",
    "sqlalchemy[asyncio]==2.0.41",
    "asyncpg==0.30.0",
    "alembic==1.15.2",
    "redis==5.3.0",
    "celery[redis]==5.5.2",
    "python-jose[cryptography]==3.4.0",
    "passlib[argon2]==1.7.4",
    "argon2-cffi==23.1.0",
    "structlog==25.4.0",
    "sentry-sdk[fastapi,celery]==2.22.0",
    "httpx==0.28.1",
    "tenacity==9.1.2",
    "python-multipart==0.0.20",
    "email-validator==2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.1",
    "pytest-asyncio==0.26.0",
    "pytest-cov==6.2.1",
    "httpx==0.28.1",
    "ruff==0.11.13",
    "mypy==1.16.0",
    "pre-commit==4.2.0",
    "factory-boy==3.3.3",
    "faker==37.3.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "S",    # bandit (security)
    "B",    # bugbear
    "A",    # builtins
    "C4",   # comprehensions
    "T20",  # print statements
    "SIM",  # simplify
    "ERA",  # eradicate commented code
    "RUF",  # ruff-specific
]
ignore = [
    "S101",  # allow assert in tests
    "S104",  # allow binding to 0.0.0.0
    "B008",  # allow Depends() in function args
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["celery.*", "redis.*", "jose.*", "passlib.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short --strict-markers"
markers = [
    "unit: Unit tests (no external dependencies)",
    "integration: Integration tests (require running services)",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"
